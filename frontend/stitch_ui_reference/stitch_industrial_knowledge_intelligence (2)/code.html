<style>

        }
        .gradient-border-insight {
            position: relative;

        }
        .gradient-border-insight::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 1rem;
            padding: 1px;
            background: linear-gradient(to right, #004ac6, #0074a6);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface sticky top-0 z-50 w-full flex items-center px-lg py-md max-w-container-max mx-auto">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 flex items-center justify-center">
<img alt="Industrial Intelligence Logo" class="w-full h-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTvu9xJ94qnz0AxXZGynUzeyyq903bFr93xHbt7mBavea2dtHUHzsZfs1s795lAujSxkN6z0hOZxza_OqIpmseFGsXQONiPXRzSYRcSSjbLfRnxmqfE7cAzSLM17o7IMMnZbyNl2h9xrKUIU2A8E3LZKolgol4JgmAOjWy3DzpAllG1u30zNZuUvB0c9jfF-RFdpEXX3M6JHXpqCYnHrmiKJI0-JtlVnoQFCAtTk87I1HbtNq68IQ"/>
</div>
<span class="font-headline-md text-headline-md font-bold text-primary">Industrial Intelligence</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-start px-md pt-lg pb-xxl max-w-[500px] mx-auto w-full">
<!-- Welcome Section -->
<section class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your industrial intelligence</p>
</section>
<!-- Central Illustration -->
<div class="w-full mb-xl">
<div class="aspect-square w-full rounded-xl overflow-hidden soft-elevation bg-surface-container-lowest flex items-center justify-center">
<img alt="AI and industrial document intelligence illustration" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDbPeXWkO895EzaH_BK3ckrTunx0Ya6eg7j-WeR3CYT8mfRihwm-q3527FhQUghjoOFLEQQF3bvdy8d6MCYBqOEy8l181k-LjHH5AfqQxhDpBJuoFh4I07BQYY0BNswWcfjhdUyBGJn--8R4OMyp8txUPjWqPX32Hb8da6wEMcS7tRS4yuWPj7bEBDxIbj52n1N45cMnGezqJOj_0j6NUaKPDS7z5KbLNa6zGadOsHpi7-CLyu5PBQ"/>
</div>
</div>
<!-- Login Card -->
<div class="w-full bg-white rounded-xl p-lg soft-elevation border border-outline-variant/30">
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-md py-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" id="email" placeholder="email@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-10 py-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary outline-none transition-all font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="pw-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-md bg-[#2563EB] hover:bg-primary text-white font-label-md text-label-md rounded-lg shadow-sm active:opacity-80 transition-all duration-150 flex items-center justify-center gap-sm mt-lg" type="submit">
<span>Login</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
<!-- Forgot Password -->
<div class="text-center pt-xs">
<a class="font-body-sm text-body-sm text-primary hover:underline decoration-primary-container transition-all" href="#">Forgot password?</a>
</div>
</form>
</div>
<!-- Social Proof/Help Tooltip -->
<div class="mt-xl p-md rounded-lg bg-surface-container-low border border-primary/10 flex items-start gap-md">
<span class="material-symbols-outlined text-tertiary-container">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Need specialized access for factory floor terminals? Contact your <span class="text-primary font-medium">System Administrator</span>.
            </p>
</div>
</main>
<!-- Footer -->
<footer class="mt-auto w-full bg-surface py-xl px-lg border-t border-outline-variant/20">
<div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-md">
<p class="font-body-sm text-body-sm text-outline">© 2024 Industrial Intelligence Systems</p>
<div class="flex items-center gap-lg">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</div>
</footer>
<script>
        function togglePassword() {
            const pwField = document.getElementById('password');
            const icon = document.getElementById('pw-toggle-icon');
            if (pwField.type === 'password') {
                pwField.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                pwField.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Add a subtle ripple or interaction feel
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
<style>
        /* Interactive Micro-animation */
        input:focus {
            transform: translateY(-1px);
        }
        button:active {
            transform: scale(0.98);
        }
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</body></html>
